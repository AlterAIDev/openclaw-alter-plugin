name: ci

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  build-test:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    # Under a minute observed; `pnpm dev --smoke` boots a real gateway, and a
    # hung one should not hold a runner for the 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          # Exact pin: a bare `10` floats to whatever pnpm 10.x is newest that day.
          version: 10.34.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Includes tests/e2e: the real plugin and Alter SDK against dev/fake-alter.mjs.
      - run: pnpm test
      - run: pnpm build
      # A real OpenClaw gateway with the plugin, booted and checked, then stopped.
      - run: pnpm dev --smoke

  # Developer Certificate of Origin: every commit in a pull request must carry
  # a Signed-off-by line with its author's email (git commit -s). See
  # CONTRIBUTING.md and https://developercertificate.org.
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "${BASE}..${HEAD}"); do
            email="$(git log -1 --format='%ae' "${sha}" | tr '[:upper:]' '[:lower:]')"
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "${sha}" | tr '[:upper:]' '[:lower:]' | grep -qF "<${email}>"; then
              echo "::error::$(git log -1 --format='%h %s (%an <%ae>)' "${sha}") has no 'Signed-off-by:' line with the author's email"
              missing=$((missing + 1))
            fi
          done
          if [ "${missing}" -gt 0 ]; then
            echo "${missing} commit(s) need a DCO sign-off: run 'git rebase --signoff main' (or 'git commit --amend -s' for one commit), then force-push the branch."
            exit 1
          fi
          echo "Every commit is signed off."

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # The gitleaks binary rather than gitleaks-action: the action needs a
      # paid license key on organization-owned repositories.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks

      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact .'
